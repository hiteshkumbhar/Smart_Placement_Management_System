tags:
  - Student Profile

summary: Upload student profile photo

description: >
  Uploads or replaces the profile photo of the currently authenticated
  student. Only JPG, JPEG, and PNG files are accepted.
  The uploaded photo must not exceed 5 MB.

security:
  - Bearer: []

consumes:
  - multipart/form-data

produces:
  - application/json

parameters:
  - in: formData
    name: profile_photo
    type: file
    required: true
    description: >
      Student profile photo.
      Accepted formats are JPG, JPEG, and PNG.
      Maximum file size is 5 MB.

responses:
  200:
    description: Profile photo updated successfully.
    schema:
      type: object
      properties:
        message:
          type: string
          example: Profile photo updated successfully
        profile_pic:
          type: string
          example: User_12_Rahul_Sharma.jpg

  400:
    description: Missing photo or unsupported file format.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Profile photo is required

  401:
    description: User not found.
    schema:
      type: object
      properties:
        error:
          type: string
          example: User not found

  403:
    description: Only students can access this endpoint.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Forbidden: students only"

  413:
    description: Uploaded photo exceeds the maximum allowed size.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Photo must not exceed 5 MB

  500:
    description: Unable to save profile photo.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Unable to save profile photo