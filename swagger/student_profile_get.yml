tags:
  - Student Profile

summary: Get student profile

description: >
  Retrieves the profile details of the currently authenticated student.
  Access is restricted to users with the student role.

security:
  - Bearer: []

produces:
  - application/json

responses:
  200:
    description: Student profile retrieved successfully.
    schema:
      type: object
      properties:
        profile:
          type: object
          properties:
            user_id:
              type: integer
              example: 12
            name:
              type: string
              example: Rahul Sharma
            branch:
              type: string
              example: Computer Science
            cgpa:
              type: number
              example: 8.5
            skills:
              type: string
              example: Python, Flask, SQL
            graduation_year:
              type: integer
              example: 2027
            mobile_number:
              type: string
              example: "9876543210"
            Gender:
              type: string
              example: Male
            DOB:
              type: string
              example: "2003-05-15"
            Address:
              type: string
              example: Mumbai, Maharashtra
            City:
              type: string
              example: Mumbai
            State:
              type: string
              example: Maharashtra
            pin_code:
              type: string
              example: "400001"
            University_Roll_Number:
              type: string
              example: "CS2023001"
            Semester:
              type: integer
              example: 7
            tenth_Percentage:
              type: number
              example: 85.5
            twelth_Percentage:
              type: number
              example: 82.5
            Diploma_Percentage:
              type: number
              example: 80.0
            Total_Backlogs:
              type: integer
              example: 2
            Active_Backlogs:
              type: integer
              example: 0
            LinkedIn:
              type: string
              example: https://linkedin.com/in/rahul
            GitHub:
              type: string
              example: https://github.com/rahul
            Portfolio_Website:
              type: string
              example: https://rahulportfolio.com
            LeetCode:
              type: string
              example: https://leetcode.com/rahul
            HackerRank:
              type: string
              example: https://hackerrank.com/rahul
            Certification:
              type: string
              example: Python, SQL
            profile_pic:
              type: string
              example: User_12_Rahul_Sharma.jpg
            resume_path:
              type: string
              example: Resume_12_Rahul_Sharma.pdf
            resume_status:
              type: string
              example: Pending
            updated_at:
              type: string
              example: "2026-10-31T10:30:00"

  401:
    description: User not found.
    schema:
      type: object
      properties:
        error:
          type: string
          example: User not found

  403:
    description: Only students can access this endpoint.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Forbidden: students only"

  404:
    description: Student profile not found.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Student profile not found