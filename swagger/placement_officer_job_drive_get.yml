tags:
  - Placement Officer
  - Job Drives

summary: Retrieve posted job drives

description: >
  Retrieves posted job drives associated with companies created
  by the authenticated placement officer.

  Only job drives with posted='Y' and status other than 'Closed'
  are included.

  The results can optionally be searched by company name or
  job title. Search matching is case-insensitive.

security:
  - Bearer: []

produces:
  - application/json

parameters:
  - name: search
    in: query
    type: string
    required: false
    description: >
      Optional search term used to filter job drives by company
      name or job title. Matching is case-insensitive.
    example: Software Engineer

responses:
  200:
    description: >
      Posted job drives retrieved successfully.
      Returns the matching job drives and the mode value.
    schema:
      type: object
      properties:
        jobs:
          type: array
          description: List of matching posted job drives.
          items:
            type: object
            properties:
              company_name:
                type: string
                example: Example Technologies

              job_drive:
                type: object
                properties:
                  id:
                    type: integer
                    example: 12

                  company_id:
                    type: integer
                    example: 3

                  title:
                    type: string
                    example: Software Engineer

                  package:
                    type: string
                    x-nullable: true
                    example: "12 LPA"

                  location:
                    type: string
                    x-nullable: true
                    example: Mumbai

                  CGPA:
                    type: number
                    x-nullable: true
                    example: 7.5

                  Eligible_Branches:
                    type: string
                    x-nullable: true
                    example: "Computer Science,Information Technology"

                  Graduation_Year:
                    type: integer
                    x-nullable: true
                    example: 2027

                  Vacancies:
                    type: integer
                    x-nullable: true
                    example: 5

                  deadline:
                    type: string
                    x-nullable: true
                    example: "2026-12-15"

                  description:
                    type: string
                    x-nullable: true
                    example: Software development role.

                  status:
                    type: string
                    example: Active

                  posted:
                    type: string
                    example: "Y"

              logo_path:
                type: string
                x-nullable: true
                example: static/Docs/company/logo.png

        mode:
          type: string
          description: >
            Mode value read from request.form. For GET requests,
            this is normally an empty string.
          example: ""

  401:
    description: >
      Authentication is missing, invalid, or expired.
    schema:
      type: object
      properties:
        msg:
          type: string
          example: Missing Authorization Header

  403:
    description: >
      The authenticated user does not have the Placement_Officer role.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Forbidden