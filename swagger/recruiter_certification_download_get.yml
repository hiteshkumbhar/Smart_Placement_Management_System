tags:
  - Recruiter
  - Certifications

summary: Download a student's certification using GET

description: >
  Downloads a certification document belonging to a specified student.
  Only authenticated users with the Recruiter or Placement_Officer role
  can access this endpoint.

  The certification filename and student user ID must be supplied
  as URL query parameters.

security:
  - Bearer: []

produces:
  - application/octet-stream
  - application/json

parameters:
  - name: name
    in: query
    type: string
    required: true
    description: >
      Name of the certification file to download.
      This value is used to construct the stored certification filename
      and is also used as the downloaded filename.
    example: Python_Certificate.pdf

  - name: id
    in: query
    type: integer
    required: true
    description: >
      User ID of the student whose certification is being downloaded.
    example: 25

responses:
  200:
    description: >
      Certification file returned successfully as a downloadable attachment.
      The response contains file contents, not a JSON object.
    schema:
      type: file
    headers:
      Content-Disposition:
        type: string
        description: Indicates that the response is an attachment.
        example: attachment; filename="Python_Certificate.pdf"

  400:
    description: >
      Required query parameters are missing, or the supplied user ID
      cannot be converted to an integer.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Both name and id are required

  401:
    description: >
      Authentication failed, or the authenticated user account
      could not be found.
    schema:
      type: object
      properties:
        msg:
          type: string
          description: JWT authentication error, when generated by Flask-JWT-Extended.
          example: Missing Authorization Header
        error:
          type: string
          description: Error generated by the route.
          example: User not found

  403:
    description: >
      The authenticated user does not have the Recruiter or
      Placement_Officer role.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Forbidden

  404:
    description: >
      The specified user does not exist, or the certification
      file cannot be found.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Certification file not found