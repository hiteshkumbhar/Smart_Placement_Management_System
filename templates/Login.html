<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, Helvetica, sans-serif;

        position: relative;
        overflow: hidden;

        /* Soft blue background */
        background:
            linear-gradient(
                135deg,
                #eaf3ff 0%,
                #e4efff 50%,
                #edf5ff 100%
            );
    }


    /* ==================================================
       BACKGROUND BLUE CIRCLES
       ================================================== */

    .bg-circle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
    }

    /*
        Large circle at top-left.
        Only a portion of it should be visible.
    */

    .circle-top {
        width: 390px;
        height: 390px;
        top: -205px;
        left: -130px;
        background: rgba(91, 148, 232, 0.18);
    }

    /*
        Large soft circle on left side.
    */

    .circle-left {
        width: 430px;
        height: 430px;

        left: -310px;
        top: 250px;

        border: 70px solid rgba(91, 148, 232, 0.10);
    }


    /*
        Large circle on right side.
    */

    .circle-right {
        width: 480px;
        height: 480px;

        right: -130px;
        bottom: -80px;

        border: 70px solid rgba(91, 148, 232, 0.12);
    }


    /*
        Small decorative circles
    */

    .circle-small-one {
        width: 36px;
        height: 36px;

        right: 14%;
        top: 24%;

        border: 2px solid rgb(255, 255, 255);
    }

    .circle-small-two {
        width: 38px;
        height: 38px;

        left: 13%;
        bottom: 8%;

        border: 2px solid rgb(255, 255, 255);
    }


    /* ==================================================
       DOT PATTERNS
       ================================================== */

    .dots {
        position: absolute;
        display: grid;
        grid-template-columns: repeat(7, 5px);
        gap: 11px;
        pointer-events: none;
        opacity: 0.55;
    }

    .dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: white;
    }

    .dots-top {
        top: 28px;
        right: 7%;
    }

    .dots-bottom {
        bottom: 105px;
        left: 5%;
    }
    /* ==================================================
       LOGIN FORM
       ================================================== */

    .login-card {
        position: relative;
        z-index: 10;

        width: 420px;

        background: rgba(255, 255, 255, 0.97);

        border-radius: 18px;

        padding: 25px 32px 27px;

        box-shadow:
            0 12px 30px rgba(40, 75, 120, 0.14),
            0 3px 8px rgba(40, 75, 120, 0.06);
    }


    /* ==================================================
       LOGO
       ================================================== */

    .logo-container {
        width: 58px;
        height: 58px;

        margin: 0 auto 6px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #eaf3ff;
    }

    .logo-container svg {
        width: 43px;
        height: 43px;
    }


    /* ==================================================
       LOGIN TITLE
       ================================================== */

    .login-title {
        text-align: center;

        font-size: 32px;

        line-height: 1.1;

        font-weight: 700;

        color: #102d61;

        margin-bottom: 10px;
    }


    /* Small line underneath Login */

    .title-decoration {
        width: 115px;
        height: 1px;

        margin: 0 auto 20px;

        background: #dce4ee;

        position: relative;
    }

    .title-decoration::after {
        content: "";
        position: absolute;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #1478ef;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 4px white;
    }


    /* ==================================================
       FORM GROUP
       ================================================== */

    .form-group {
        margin-bottom: 15px;
    }


    .form-label {
        display: block;

        font-size: 15px;

        font-weight: 600;

        color: #142e5d;

        margin-bottom: 6px;
    }


    /* ==================================================
       INPUT
       ================================================== */

    .input-container {
        width: 100%;
        height: 46px;

        display: flex;
        align-items: center;

        background: white;

        border: 1px solid #cbd6e5;

        border-radius: 8px;

        overflow: hidden;

        transition: 0.2s ease;
    }

    .input-container:focus-within {
        border-color: #2184ed;

        box-shadow:
            0 0 0 3px rgba(33, 132, 237, 0.08);
    }


    .input-icon {
        width: 45px;
        height: 100%;

        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #eef5ff;

        border-right: 1px solid #dce5f1;
    }

    .input-icon svg {
        width: 19px;
        height: 19px;

        stroke: #1478ef;

        fill: none;

        stroke-width: 2;
    }


    .input-container input {
        flex: 1;

        width: 100%;
        height: 100%;

        border: none;
        outline: none;

        padding: 0 12px;

        font-size: 14px;

        color: #26364f;

        background: white;
    }

    .input-container input::placeholder {
        color: #9aa7ba;
    }


    /* ==================================================
       PASSWORD EYE
       ================================================== */

    .password-eye {
        width: 42px;
        height: 100%;

        border: none;

        background: white;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        padding: 0;
    }

    .password-eye svg {
        width: 18px;
        height: 18px;
        stroke: #71829a;
        fill: none;
        stroke-width: 2;
    }

    /* ==================================================
       LINKS
       ================================================== */

    .links {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 25px;
        margin-bottom: 60px;
    }

    .links a {
        text-decoration: none;
        color: #1478ed;
        font-size: 14px;
        transition: 0.2s ease;
    }

    .links a:hover {
        color: #075dc4;
        text-decoration: underline;
    }


    /* ==================================================
       LOGIN BUTTON
       ================================================== */

    .loginbtn {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(
            135deg,
            #147ef5,
            #0966df
        );
        color: white;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        box-shadow: 0 5px 12px rgba(20, 126, 245, 0.20);
        transition: 0.2s ease;
    }

    .loginbtn:hover {
        transform: translateY(-1px);
        box-shadow:
            0 7px 15px rgba(20, 126, 245, 0.25);
    }

    .login-icon {
        width: 19px;
        height: 19px;
        stroke: white;
        fill: none;
        stroke-width: 2;
    }

    /* ==================================================
       FLASH MESSAGE
       ================================================== */

    .flash-message {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #fff1f1;
        border: 1px solid #ffcaca;
        color: #c62828;
        font-size: 13px;
        text-align: center;
    }


    /* ==================================================
       OR DIVIDER
       ================================================== */

    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0;
    }

    .divider-line {
        flex: 1;
        height: 1px;
        background: #dce3ec;
    }

    .divider-text {
        font-size: 13px;
        color: #7a8798;
    }

    /* ==================================================
       WELCOME BOX
       ================================================== */

    .welcome-box {
        min-height: 66px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 12px;
        border: 1px solid #c5daf7;
        border-radius: 8px;
        background:
            linear-gradient(
                135deg,
                #f1f7ff,
                #eaf3ff
            );
    }


    .welcome-icon {
        width: 42px;
        height: 42px;
        flex-shrink: 0;
        border-radius: 50%;
        background: #dceaff;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .welcome-icon svg {
        width: 23px;
        height: 23px;
        stroke: #1378ef;
        fill: none;
        stroke-width: 2.3;
    }
    .welcome-text h3 {
        font-size: 15px;
        color: #123470;
        margin-bottom: 2px;
    }
    .welcome-text p {
        font-size: 12.5px;
        color: #566477;
        line-height: 1.3;
    }
    /* ==================================================
       RESPONSIVE
       ================================================== */

    @media (max-width: 600px) {

        .login-card {
            width: calc(100% - 30px);

            padding: 23px 24px 25px;
        }

        .login-title {
            font-size: 29px;
        }

        .dots {
            display: none;
        }
    }


    @media (max-width: 400px) {

        .login-card {
            width: calc(100% - 20px);

            padding: 20px 18px 22px;
        }

        .login-title {
            font-size: 27px;
        }

        .links a {
            font-size: 13px;
        }

        .welcome-text h3 {
            font-size: 14px;
        }

        .welcome-text p {
            font-size: 11.5px;
        }
    }
</style>
</head>


<body>

    <!-- =========================================
         BACKGROUND DECORATIONS
    ========================================== -->

    <div class="bg-circle circle-top"></div>
    <div class="bg-circle circle-right"></div>
    <div class="bg-circle circle-right-outer"></div>
    <div class="bg-circle circle-right-inner"></div>
    <div class="bg-circle circle-small-one"></div>
    <div class="bg-circle circle-small-two"></div>

    <!-- Top dots -->

    <div class="dots dots-top">

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

    </div>


    <!-- Bottom dots -->

    <div class="dots dots-bottom">

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>

    </div>


    <!-- =========================================
         LOGIN CARD
    ========================================== -->

    <form
        class="login-card"
        method="POST"
        action="{{ url_for('Student_login') }}"
    >

        <!-- =====================================
             LOGO
        ====================================== -->

        <div class="logo-container">

            <svg
                viewBox="0 0 200 185"
                xmlns="http://www.w3.org/2000/svg"
            >

                <!-- Shield -->

                <path
                    d="
                    M42 42
                    C62 42 82 38 100 24
                    C118 38 138 42 158 42
                    C164 42 166 46 164 52
                    C162 58 162 66 162 76
                    V112
                    C162 138 144 150 100 176
                    C56 150 38 138 38 112
                    V76
                    C38 66 38 58 36 52
                    C34 46 36 42 42 42
                    Z"
                    fill="none"
                    stroke="#1478ef"
                    stroke-width="5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

                <!-- Graduation cap -->

                <polygon
                    points="58,79 100,61 142,79 100,97"
                    fill="#1478ef"
                />

                <!-- Cap -->

                <path
                    d="
                    M76 93
                    V109
                    C76 121 124 121 124 109
                    V93
                    L100 103
                    Z"
                    fill="#1478ef"
                />

                <!-- Tassel -->

                <path
                    d="M65 83 V109"
                    stroke="#1478ef"
                    stroke-width="4"
                    stroke-linecap="round"
                />

                <rect
                    x="61"
                    y="107"
                    width="8"
                    height="14"
                    rx="4"
                    fill="#1478ef"
                />

            </svg>

        </div>


        <!-- =====================================
             TITLE
        ====================================== -->

        <h1 class="login-title">
            Login
        </h1>

        <div class="title-decoration"></div>


        <!-- =====================================
             EMAIL
        ====================================== -->

        <div class="form-group">

            <label class="form-label">
                Email
            </label>

            <div class="input-container">

                <div class="input-icon">

                    <!-- Email icon -->

                    <svg
                        viewBox="0 0 24 24"
                    >
                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                        />

                        <polyline
                            points="3,7 12,13 21,7"
                        />
                    </svg>

                </div>


                <input
                    type="text"
                    name="email"
                    placeholder="Type your Email"
                    required
                    oninvalid="this.setCustomValidity('Please enter your email address')"
                    oninput="this.setCustomValidity('')"
                >

            </div>

        </div>


        <!-- =====================================
             PASSWORD
        ====================================== -->

        <div class="form-group">

            <label class="form-label">
                Password
            </label>

            <div class="input-container">

                <div class="input-icon">

                    <!-- Lock icon -->

                    <svg
                        viewBox="0 0 24 24"
                    >

                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="10"
                            rx="2"
                        />

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        />

                    </svg>

                </div>


                <input
                    id="password"
                    type="password"
                    name="pass"
                    placeholder="Type your password"
                    required
                    oninvalid="this.setCustomValidity('Please enter your password')"
                    oninput="this.setCustomValidity('')"
                >


                <!-- Password visibility -->

                <button
                    type="button"
                    class="password-eye"
                    onclick="togglePassword()"
                    aria-label="Show password"
                >

                    <svg
                        id="eyeIcon"
                        viewBox="0 0 24 24"
                    >

                        <path
                            d="
                            M2 12
                            C5 7 8 5 12 5
                            C16 5 19 7 22 12
                            C19 17 16 19 12 19
                            C8 19 5 17 2 12
                            Z"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />

                    </svg>

                </button>

            </div>

        </div>


        <!-- =====================================
             LINKS
        ====================================== -->

        <div class="links">

            <a href="{{ url_for('Register') }}">
                Create account
            </a>

            <a href="{{ url_for('Reset_Password') }}">
                Forgot password?
            </a>

        </div>


        <!-- =====================================
             LOGIN BUTTON
        ====================================== -->

        <button
            type="submit"
            class="loginbtn"
        >

            <!-- Login icon -->

            <svg
                class="login-icon"
                viewBox="0 0 24 24"
            >

                <path
                    d="M10 17L15 12L10 7"
                />

                <path
                    d="M15 12H3"
                />

                <path
                    d="M21 3V21"
                />

            </svg>

            <span>
                Login
            </span>

        </button>


        <!-- =====================================
             FLASH MESSAGE
        ====================================== -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    {% if category == "incorrect" %}

                        <div class="flash-message">
                            {{ message }}
                        </div>

                    {% endif %}

                {% endfor %}

            {% endif %}

        {% endwith %}


    </form>


    <!-- =========================================
         PASSWORD TOGGLE
    ========================================== -->

    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eyeIcon =
                document.getElementById("eyeIcon");

            if (password.type === "password") {

                password.type = "text";

                eyeIcon.innerHTML = `
                    <path
                        d="
                        M3 3
                        L21 21"
                    />

                    <path
                        d="
                        M10.6 10.6
                        A2 2 0 0 0
                        13.4 13.4"
                    />

                    <path
                        d="
                        M9.9 5.2
                        C10.6 5 11.3 5 12 5
                        C16 5 19 7 22 12
                        C20.9 13.8 19.7 15.1 18.3 16.1"
                    />

                    <path
                        d="
                        M6.1 6.1
                        C4.5 7.3 3.1 9.2 2 12
                        C5 17 8 19 12 19
                        C13.2 19 14.3 18.8 15.4 18.4"
                    />
                `;

            } else {

                password.type = "password";

                eyeIcon.innerHTML = `
                    <path
                        d="
                        M2 12
                        C5 7 8 5 12 5
                        C16 5 19 7 22 12
                        C19 17 16 19 12 19
                        C8 19 5 17 2 12
                        Z"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    />
                `;

            }

        }

    </script>

</body>

</html>
