<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password | Placement System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8faff);
        }

        .page-container {
            width: 100%;
            max-width: 430px;
        }

        .password-card {
            background: #ffffff;
            padding: 42px 38px;
            border-radius: 18px;
            border: 1px solid #e5eaf2;
            box-shadow: 0 18px 50px rgba(30, 60, 100, 0.12);
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #eaf2ff;
            font-size: 28px;
        }

        h1 {
            text-align: center;
            color: #172033;
            font-size: 27px;
            margin-bottom: 60px;
        }

        .form-group {
            margin-bottom: 42px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 17px;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 45px 0 43px;
            border: 1px solid #d8dee9;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            color: #1f2937;
            transition: 0.2s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: #6b7280;
            font-size: 16px;
        }

        .toggle-password:hover {
            color: #2563eb;
        }

        .password-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #6b7280;
        }

        .submit-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .submit-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.20);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .password-card {
                padding: 34px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="page-container">

        <section class="password-card">

            <div class="icon">
                🔐
            </div>

            <h1>Create New Password</h1>


            <form method="POST" action="{{ url_for('reset_token', token=token) }}">

                <div class="form-group">

                    <label for="new_password">
                        New Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔒</span>

                        <input
                            id="new_password"
                            name="password"
                            type="password"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            minlength="6"
                            maxlength="20"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >
                            show
                        </button>

                    </div>

                </div>

                <button type="submit" class="submit-button">
                    Update Password
                </button>

            </form>

            <p class="footer-text">
                Smart Placement Management System
            </p>

        </section>

    </main>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("new_password");
            const toggleButton = document.querySelector(".toggle-password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "hide";
                toggleButton.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "show";
                toggleButton.setAttribute("aria-label", "Show password");
            }
        }
    </script>

</body>
</html>
