<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title %} {% endblock %}</title>
</head>
{% block style %}
<style>
    * {
        box-sizing: border-box;
        margin: 0%;
        padding: 0%;
    }

    body {
        display: flex;
    }

    aside {
        background-image: linear-gradient(180deg, #4a0970 9%, #1667ff 50%, #1667ff 100%);
        width: 20%;
        height: 100vh;
    }

    main {
        flex: 1;
        background-color: rgb(241, 241, 241);
    }

    .nav-tite {
        display: flex;
        justify-content: center;
        gap: 0px;
        height: 100px;
        width: 100%;
        align-items: center;
        padding-left: 10px;
    }

    .nav-item:hover {
        background: rgba(255, 255, 255, 0.10);
        color: #ffffff;
    }

    .nav-item.active {
        background: linear-gradient(135deg, #5471f1,
                #4089e8);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 12px rgba(166, 102, 255, 0.75), inset 0 0 10px rgba(255, 255, 255, 0.08);
        color: #ffffff;
    }
</style>
{% endblock %}

<body>

                        <feGaussianBlur stdDeviation="1.5" result="blur" />
                        <feMerge>

                            <feMergeNode in="SourceGraphic" />
                        </feMerge>

                <path d=" M76 93 V109 C76 121 124 121 124 109 V93 L100 103 Z" fill="white" /> <!-- Tassel -->

                            <rect x="1.5" y="1.5" width="5" height="5" rx="1" fill="none" stroke="white"
