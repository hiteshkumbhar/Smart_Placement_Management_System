<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
{% block style %}
<style>
    * {
        box-sizing: border-box;
        margin: 0%;
        padding: 0%;
    }

    body {
        display: flex;
    }

    aside {
        background-image: linear-gradient(180deg, #4a0970 9%, #1667ff 50%, #1667ff 100%);
        width: 20%;
        position: fixed;
        min-height: 100vh;
    }

    main {
        flex: 1;
        background-color: rgb(241, 241, 241);
        margin-left: 20%
    }

    .nav-tite {
        display: flex;
        justify-content: center;
        gap: 5px;
        height: 100px;
        width: 100%;
        align-items: center;
        padding-left: 30px;
    }

    .nav-item:hover {
        background: rgba(255, 255, 255, 0.10);
        color: #ffffff;
    }

    .nav-item.active {
        background: linear-gradient(135deg, #5471f1,
                #4089e8);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 12px rgba(166, 102, 255, 0.75), inset 0 0 10px rgba(255, 255, 255, 0.08);
        color: #ffffff;
    }

  
</style>
{% endblock %}

<body>
    <aside>
        <div class="nav-tite">
            <svg width="110" height="95" viewBox="0 0 200 185" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="1.5" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs> <!-- Shield -->
                <path
                    d=" M42 42 C62 42 82 38 100 24 C118 38 138 42 158 42 C164 42 166 46 164 52 C162 58 162 66 162 76 V112 C162 138 144 150 100 176 C56 150 38 138 38 112 V76 C38 66 38 58 36 52 C34 46 36 42 42 42 Z "
                    fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                <!-- Graduation cap top -->
                <polygon points="58,79 100,61 142,79 100,97" fill="white" /> <!-- Cap base -->
                <path d=" M76 93 V109 C76 121 124 121 124 109 V93 L100 103 Z" fill="white" /> <!-- Tassel -->
                <path d=" M65 83 V109 " stroke="white" stroke-width="4" stroke-linecap="round" />
                <rect x="61" y="107" width="8" height="14" rx="4" fill="white" />
            </svg>
            <div style="color: rgb(255, 255, 255); font-size: 25px;"> Placement Portal </div>
        </div>

        <div class="nav-section">

            <a href="{{ url_for('student.Student_Dashboard') }}" style="text-decoration: none;">
                <div class="nav-item {% if request.endpoint == 'student.Student_Dashboard' %}active{% endif %}" data-target="Dashboard" style="margin-top: 18%; margin-left: 8%; margin-right: 9%; height: 50px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; ">
                    <div style="display: flex; align-items: center; gap: 16px; margin-left: 5%;">
                        <svg viewBox="0 0 16 16" fill="none" width="25px" height="25px"
                            xmlns="http://www.w3.org/2000/svg">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path
                                    d="M1 6V15H6V11C6 9.89543 6.89543 9 8 9C9.10457 9 10 9.89543 10 11V15H15V6L8 0L1 6Z"
                                    fill="#ffffff"></path>
                            </g>
                        </svg>
                        <span class="label" style=" font-size: 22px; color: white;">Dashboard</span>
                    </div>
                </div>
            </a>

            <a href="{{ url_for('student.Student_Profile') }}" style="text-decoration: none;">
                <div class="nav-item {% if request.endpoint == 'student.Student_Profile' %}active{% endif %}" data-target="Profile" style="margin-top: 3%; margin-left: 6%; margin-right: 9%; height: 50px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; ">
                    <div style="display: flex; align-items: center; gap: 16px; margin-left: 5%;">
                        <svg width="30px" height="30px" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M16.5 7.063C16.5 10.258 14.57 13 12 13c-2.572 0-4.5-2.742-4.5-5.938C7.5 3.868 9.16 2 12 2s4.5 1.867 4.5 5.063zM4.102 20.142C4.487 20.6 6.145 22 12 22c5.855 0 7.512-1.4 7.898-1.857a.416.416 0 0 0 .09-.317C19.9 18.944 19.106 15 12 15s-7.9 3.944-7.989 4.826a.416.416 0 0 0 .091.317z"
                                    fill="#ffffff"></path>
                            </g>
                        </svg>
                        <span class="label" style=" font-size: 22px; color: white;">Profile</span>
                    </div>
                </div>
            </a>

            <a href="{{ url_for('student.Student_Job_Drive') }}" style="text-decoration: none;">
                <div class="nav-item {% if request.endpoint == 'student.Student_Job_Drive' %}active{% endif %}" data-target="Profile"
                    style="margin-top: 3%; margin-left: 6%; margin-right: 9%; height: 50px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; ">
                    <div style="display: flex; align-items: center; gap: 11px; margin-left: 4%;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="35px" height="35px" fill="white"
                            data-name="Layer 2" viewBox="-1.6 -3.2 35.2 43.2" x="0px" y="0px">
                            <path
                                d="M28,7h-7v-1c0-1.654-1.346-3-3-3h-4c-1.654,0-3,1.346-3,3v1H4c-1.1,0-2,.9-2,2v5c0,1.65,1.35,3,3,3H15v-1c0-.55,.45-1,1-1s1,.45,1,1v1h10c1.65,0,3-1.35,3-3v-5c0-1.1-.9-2-2-2Zm-15-1c0-.551,.448-1,1-1h4c.552,0,1,.449,1,1v1h-6v-1Zm14,13c.71,0,1.39-.15,2-.42v7.42c0,1.65-1.35,3-3,3H6c-1.65,0-3-1.35-3-3v-7.42c.61,.27,1.29,.42,2,.42H15v1c0,.55,.45,1,1,1s1-.45,1-1v-1h10Z" />
                        </svg>
                        <span class="label" style=" font-size: 22px; color: white;">Job drives</span>
                    </div>
                </div>
            </a>


            <a href="{{ url_for('student.Application') }}" style="text-decoration: none;">
                <div class="nav-item {% if request.endpoint == 'student.Application' %}active{% endif %}" data-target="Profile"
                    style="margin-top: 3%; margin-left: 6%; margin-right: 9%; height: 50px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; ">
                    <div style="display: flex; align-items: center; gap: 11px; margin-left: 4%;">
                        <svg width="30px" height="30px" viewBox="0 0 24 24" fill="white"
                            xmlns="http://www.w3.org/2000/svg">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M4.17157 3.17157C3 4.34315 3 6.22876 3 10V14C3 17.7712 3 19.6569 4.17157 20.8284C5.34315 22 7.22876 22 11 22H13C16.7712 22 18.6569 22 19.8284 20.8284C21 19.6569 21 17.7712 21 14V10C21 6.22876 21 4.34315 19.8284 3.17157C18.6569 2 16.7712 2 13 2H11C7.22876 2 5.34315 2 4.17157 3.17157ZM7.25 8C7.25 7.58579 7.58579 7.25 8 7.25H16C16.4142 7.25 16.75 7.58579 16.75 8C16.75 8.41421 16.4142 8.75 16 8.75H8C7.58579 8.75 7.25 8.41421 7.25 8ZM7.25 12C7.25 11.5858 7.58579 11.25 8 11.25H16C16.4142 11.25 16.75 11.5858 16.75 12C16.75 12.4142 16.4142 12.75 16 12.75H8C7.58579 12.75 7.25 12.4142 7.25 12ZM8 15.25C7.58579 15.25 7.25 15.5858 7.25 16C7.25 16.4142 7.58579 16.75 8 16.75H13C13.4142 16.75 13.75 16.4142 13.75 16C13.75 15.5858 13.4142 15.25 13 15.25H8Z"
                                    fill="white"></path>
                            </g>
                        </svg><span class="label" style=" font-size: 22px; color: white;">My Applications</span>
                    </div>
                </div>
            </a>
            <a href="{{ url_for('student.Student_interview') }}" style="text-decoration: none;">
                <div class="nav-item {% if request.endpoint == 'student.Student_interview' %}active{% endif %}" data-target="Profile"
                    style="margin-top: 3%; margin-left: 6%; margin-right: 9%; height: 50px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; ">
                    <div style="display: flex; align-items: center; gap: 15px; margin-left: 5%;">
                        <svg fill="#ffffff" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="25px"
                            height="25px">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path
                                    d="M960 95.888l-256.224.001V32.113c0-17.68-14.32-32-32-32s-32 14.32-32 32v63.76h-256v-63.76c0-17.68-14.32-32-32-32s-32 14.32-32 32v63.76H64c-35.344 0-64 28.656-64 64v800c0 35.343 28.656 64 64 64h896c35.344 0 64-28.657 64-64v-800c0-35.329-28.656-63.985-64-63.985zm0 863.985H64v-800h255.776v32.24c0 17.679 14.32 32 32 32s32-14.321 32-32v-32.224h256v32.24c0 17.68 14.32 32 32 32s32-14.32 32-32v-32.24H960v799.984zM736 511.888h64c17.664 0 32-14.336 32-32v-64c0-17.664-14.336-32-32-32h-64c-17.664 0-32 14.336-32 32v64c0 17.664 14.336 32 32 32zm0 255.984h64c17.664 0 32-14.32 32-32v-64c0-17.664-14.336-32-32-32h-64c-17.664 0-32 14.336-32 32v64c0 17.696 14.336 32 32 32zm-192-128h-64c-17.664 0-32 14.336-32 32v64c0 17.68 14.336 32 32 32h64c17.664 0 32-14.32 32-32v-64c0-17.648-14.336-32-32-32zm0-255.984h-64c-17.664 0-32 14.336-32 32v64c0 17.664 14.336 32 32 32h64c17.664 0 32-14.336 32-32v-64c0-17.68-14.336-32-32-32zm-256 0h-64c-17.664 0-32 14.336-32 32v64c0 17.664 14.336 32 32 32h64c17.664 0 32-14.336 32-32v-64c0-17.68-14.336-32-32-32zm0 255.984h-64c-17.664 0-32 14.336-32 32v64c0 17.68 14.336 32 32 32h64c17.664 0 32-14.32 32-32v-64c0-17.648-14.336-32-32-32z">
                                </path>
                            </g>
                        </svg>

                        <span class="label" style=" font-size: 22px; color: white;">Interview</span>
                    </div>
                </div>
            </a>


        </div>
    </aside>

    <main>
        {%block main%}
        {%endblock%}
    </main>
</body>

</html>
